services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: loza
      POSTGRES_PASSWORD: loza
      POSTGRES_DB: loza_chat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loza -d loza_chat"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://loza:loza@postgres:5432/loza_chat?schema=public
      NODE_ENV: production
      PORT: 3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-min-32-chars-dev}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-32-chars-dev}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:3000}
      STORAGE_MOCK: ${STORAGE_MOCK:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      TURN_SERVER_URL: ${TURN_SERVER_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      # Dev/staging only — remove or leave blank in production
      OTP_FIXED_CODE: ${OTP_FIXED_CODE:-}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/docs').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TURN_USERNAME: ${NEXT_PUBLIC_TURN_USERNAME:-}
        NEXT_PUBLIC_TURN_CREDENTIAL: ${NEXT_PUBLIC_TURN_CREDENTIAL:-}
        NEXT_PUBLIC_QR_LOGIN_URL_PREFIX: ${NEXT_PUBLIC_QR_LOGIN_URL_PREFIX:-mobile://qr-login?session=}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Internal Docker URL for server-side (SSR/Server Actions) calls to the API
      LOZA_API_BASE_URL: http://api:3000
      # Public URL the browser uses for Socket.IO and media (must be reachable from the client)
      LOZA_API_PUBLIC_URL: ${API_PUBLIC_BASE_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      - "3001:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  postgres_data:
